type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: cuentas-webapi - CRUD Notas (US 1.2)
meta:
  id: wrk_cuentas_webapi_crud_notas
  created: 1784300000000
  modified: 1784300000000
  description: "Pruebas de integracion - US 1.2 CRUD de notas debito/credito. API en http://localhost:3000 (node src/index.js con env MSSQL_USER/MSSQL_PASS/MSSQL_DATABASE). Ejecutar en orden 1 -> 16: asume que existe una cuenta activa con id=1 en la BD y que el id de nota 1 esta libre (o ajustar cuentaId/notaId en los requests)."
collection:
  - url: http://localhost:3000/notas
    name: 1. Crear nota credito (esperado 201 + id)
    meta:
      id: req_n1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
      created: 1784300000000
      modified: 1784300000000
      isPrivate: false
      description: "AC Escenario 1: POST con cuenta existente, tipo credito, monto positivo y descripcion -> 201 y el id generado (INT IDENTITY). La nota queda registrada en la BD asociada a la cuenta."
      sortKey: -1784299999950
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "cuentaId": 1,
          "tipo": "credito",
          "monto": 150.75,
          "descripcion": "Pago de cliente"
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.1.0
        description: ""
        disabled: false
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
